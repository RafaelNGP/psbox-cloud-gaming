# SPDX-License-Identifier: GPL-3.0-or-later
# Every push and pull request: the SDL-free desktop build (psbox-headless
# included) with its unit tests, PS5 calls kept in the PS5 backends, the
# SDL3 app with its self-test and Linux AppImage (linux-app), and a scan of
# the changes for account data. The PS5 build needs the PS5_Vulkan toolchain,
# which isn't here: tools/release.sh checks it before a release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  triage-rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/triage
      - name: Issue triage rules
        run: cd .github/triage && python3 -m unittest -v test_triage

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # No sce* call or #if XCLOUD_PS5 outside the PS5 backends
      # (docs/multiplatform.md).
      - name: Platform boundaries
        run: bash tools/check-platform-boundaries.sh

      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q cmake ninja-build clang llvm nasm

      # FFmpeg is configured and built by tools/build-ffmpeg.sh the first
      # time CMake runs (minutes): kept between runs while its source and
      # the script stay the same.
      - name: FFmpeg cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/xcloud-ps5
          key: ffmpeg-host-${{ hashFiles('.git/modules/deps/ffmpeg/HEAD', 'tools/build-ffmpeg.sh') }}

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        # The SDL-free targets only: psbox-headless, xcloud-cli, xcloud-tests
        # (the SDL3 app has its own job, linux-app).
        run: cmake -S . -B build-host -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DXCLOUD_DESKTOP_APP=OFF

      - name: Build
        run: ninja -C build-host

      - name: Unit tests
        run: ctest --test-dir build-host --output-on-failure

  # The SDL3 desktop app (psbox) and its Linux AppImage. Built on the oldest
  # supported runner: its glibc is the package's baseline (ubuntu-22.04 with glibc 2.35).
  # SDL3 is built from its release (every backend loaded at run time, so one libSDL3.so.0
  # serves X11 and Wayland, PulseAudio, PipeWire and ALSA) and bundled.
  linux-app:
    runs-on: ubuntu-22.04
    env:
      SDL3_VERSION: 3.4.18
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Tools and SDL3's backend libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake ninja-build clang llvm nasm pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev \
            libdrm-dev libgbm-dev libvulkan-dev mesa-vulkan-drivers \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libjack-jackd2-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev libusb-1.0-0-dev

      - name: SDL3 cache
        id: sdl3-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/xcloud-ps5/sdl3-${{ env.SDL3_VERSION }}
          key: linux-app-sdl3-${{ env.SDL3_VERSION }}-ubuntu-22.04-r1

      - name: SDL3 ${{ env.SDL3_VERSION }}
        if: steps.sdl3-cache.outputs.cache-hit != 'true'
        run: |
          prefix=~/.cache/xcloud-ps5/sdl3-$SDL3_VERSION
          work=$(mktemp -d)
          curl -sSLf -o "$work/sdl.tar.gz" "https://github.com/libsdl-org/SDL/releases/download/release-$SDL3_VERSION/SDL3-$SDL3_VERSION.tar.gz"
          tar xzf "$work/sdl.tar.gz" -C "$work"
          cmake -S "$work/SDL3-$SDL3_VERSION" -B "$work/build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$prefix" -DCMAKE_INSTALL_LIBDIR=lib \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build "$work/build"
          cmake --install "$work/build"
          mkdir -p "$prefix/share/licenses/SDL3"
          cp "$work/SDL3-$SDL3_VERSION/LICENSE.txt" "$prefix/share/licenses/SDL3/LICENSE.txt"

      - name: FFmpeg cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/xcloud-ps5/ffmpeg-host
          key: linux-app-ffmpeg-host-${{ hashFiles('.git/modules/deps/ffmpeg/HEAD', 'tools/build-ffmpeg.sh') }}

      - name: Configure
        run: |
          cmake -S . -B build-app -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DXCLOUD_DESKTOP_APP=ON \
            -DCMAKE_PREFIX_PATH="$HOME/.cache/xcloud-ps5/sdl3-$SDL3_VERSION"

      - name: Build
        run: ninja -C build-app

      - name: Unit tests
        run: ctest --test-dir build-app --output-on-failure

      - name: Self-test (window, screens, input, sound; no account)
        env:
          SDL_VIDEO_DRIVER: offscreen
          SDL_AUDIO_DRIVER: dummy
          XCLOUD_DATA_DIR: ${{ runner.temp }}/psbox-data
        run: build-app/psbox --selftest "$RUNNER_TEMP/psbox-selftest"

      - name: Package (AppImage, self-tested)
        run: bash tools/desktop/package-appimage.sh build-app build-app/pkg

      - uses: actions/upload-artifact@v7
        with:
          name: psbox-linux-x86_64
          path: build-app/pkg/PSBox-*-linux-x86_64.AppImage
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: psbox-selftest
          path: ${{ runner.temp }}/psbox-selftest
          if-no-files-found: ignore

  windows-app:
    runs-on: ubuntu-24.04
    env:
      SDL3_VERSION: 3.4.18
      LLVM_MINGW_VERSION: 20261104
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Tools and Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -y -q cmake ninja-build wine64 wine nasm

      - name: Toolchain cache (llvm-mingw)
        id: toolchain-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/xcloud-ps5/llvm-mingw-${{ env.LLVM_MINGW_VERSION }}
          key: windows-toolchain-llvm-mingw-${{ env.LLVM_MINGW_VERSION }}

      - name: Fetch Toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: bash tools/windows/fetch-toolchain.sh

      - name: SDL3 MinGW cache
        id: sdl3-mingw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/xcloud-ps5/sdl3-${{ env.SDL3_VERSION }}-mingw
          key: windows-sdl3-${{ env.SDL3_VERSION }}-mingw-r1

      - name: Fetch SDL3 MinGW
        if: steps.sdl3-mingw-cache.outputs.cache-hit != 'true'
        run: bash tools/windows/fetch-sdl3.sh

      - name: FFmpeg Windows cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/xcloud-ps5/ffmpeg-windows
          key: windows-app-ffmpeg-${{ hashFiles('.git/modules/deps/ffmpeg/HEAD', 'tools/build-ffmpeg.sh') }}

      - name: Configure
        run: |
          cmake -S . -B build-win -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE=cmake/windows.toolchain.cmake \
            -DXCLOUD_DESKTOP_APP=ON \
            -DCMAKE_PREFIX_PATH="$HOME/.cache/xcloud-ps5/sdl3-${{ env.SDL3_VERSION }}-mingw/x86_64-w64-mingw32"

      - name: Build
        run: ninja -C build-win psbox

      - name: Self-test (Wine headless)
        run: |
          mkdir -p "${{ runner.temp }}/psbox-selftest" "${{ runner.temp }}/psbox-data"
          target_dir=$(WINEDEBUG=-all winepath -w "${{ runner.temp }}/psbox-selftest")
          WINEDEBUG=-all SDL_VIDEO_DRIVER=offscreen SDL_AUDIO_DRIVER=dummy \
            XCLOUD_DATA_DIR="${{ runner.temp }}/psbox-data" \
            wine build-win/psbox.exe --selftest "$target_dir"

      - name: Package (portable zip and sha256)
        run: bash tools/desktop/package-windows.sh build-win build-win/pkg

      - uses: actions/upload-artifact@v7
        with:
          name: psbox-windows-x86_64
          path: build-win/pkg/PSBox-*-windows-x86_64.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: psbox-windows-x86_64-sha256
          path: build-win/pkg/PSBox-*-windows-x86_64.zip.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: psbox-windows-selftest
          path: ${{ runner.temp }}/psbox-selftest
          if-no-files-found: ignore

  account-data:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Tokens look like JWTs (eyJ...), refresh tokens or XBL3.0 headers; the
      # sign-in file, logs and captures never belong in the repository.
      - name: No account data in the changes
        run: |
          base=${{ github.event.pull_request.base.sha }}
          if git diff "$base"...HEAD | grep -nE '^\+.*(eyJ[A-Za-z0-9_-]{20,}|refresh_token"? *[:=] *"[A-Za-z0-9]|XBL3\.0 x=[0-9])'; then
            echo "::error::A token or sign-in data in the changes"; exit 1
          fi
          if git diff --name-only --diff-filter=AM "$base"...HEAD | grep -nE '(^|/)account\.json$|\.log$|\.ppm$|\.aus$|\.h264$|(^|/)autoplay\.txt$'; then
            echo "::error::A file that must not be committed"; exit 1
          fi
          echo "clean"

  android-app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK 27.2.12479018
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: FFmpeg Android Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/xcloud-ps5/ffmpeg-android-arm64-v8a
            ~/.cache/xcloud-ps5/ffmpeg-android-x86_64
          key: android-ffmpeg-${{ hashFiles('.git/modules/deps/ffmpeg/HEAD', 'tools/build-ffmpeg.sh') }}

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew :app:assembleDebug --stacktrace

      - name: Verify 16 KB Page Alignment
        run: |
          unzip -q android/app/build/outputs/apk/debug/app-debug.apk "lib/*/*.so" -d /tmp/apk-libs
          for so in /tmp/apk-libs/lib/*/*.so; do
            align=$(readelf -l -W "$so" | awk '/LOAD/ {print $NF; exit}')
            echo "Checking $so: alignment = $align"
            if [[ "$align" != "0x4000" && "$align" != "0x10000" ]]; then
              echo "::error::Binary $so is NOT 16 KB page-aligned (alignment: $align)"
              exit 1
            fi
          done
          echo "All shared libraries in APK are 16 KB page-aligned."

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: psbox-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

